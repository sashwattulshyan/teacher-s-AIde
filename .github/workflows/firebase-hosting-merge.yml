name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Firebase Secrets
        id: check-secrets
        run: |
          if [ -z "${{ secrets.VITE_FIREBASE_API_KEY }}" ]; then
            echo "⚠️  WARNING: Firebase secrets not configured in GitHub Secrets"
            echo "⚠️  The build will fail. Please add the following secrets:"
            echo "   - VITE_FIREBASE_API_KEY"
            echo "   - VITE_FIREBASE_AUTH_DOMAIN"
            echo "   - VITE_FIREBASE_PROJECT_ID"
            echo "   - VITE_FIREBASE_STORAGE_BUCKET"
            echo "   - VITE_FIREBASE_MESSAGING_SENDER_ID"
            echo "   - VITE_FIREBASE_APP_ID"
            echo "⚠️  Go to: Settings → Secrets and variables → Actions"
            exit 1
          fi
      - name: Build frontend
        working-directory: ./client
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TEACHERS_AIDE_APP }}
          channelId: live
          projectId: teachers-aide-app
